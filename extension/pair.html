<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kendali — connect this browser?</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 18px; color: #111; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  p { color: #444; margin: 0 0 14px; }
  label { display: block; color: #555; font-size: 12px; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  button { padding: 6px 14px; }
  #ok { background: #16a34a; color: #fff; border: 0; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Use this browser for Kendali?</h1>
  <p>An MCP client asked which browser to control. Click <b>Connect</b> only in the browser you want it to use.</p>
  <label for="name">Name for this browser</label>
  <input id="name" maxlength="60">
  <div class="row"><button id="no">Not this one</button><button id="ok">Connect</button></div>
  <script src="pair.js"></script>
</body>
</html>
